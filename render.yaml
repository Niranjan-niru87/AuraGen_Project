services:
  - type: web
    name: auragen-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ..
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: GROQ_API_KEY
        sync: false
